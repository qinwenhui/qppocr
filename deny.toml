# cargo-deny 配置：许可与依赖审计。
# 本项目刻意保持极少依赖且全部 feature 门控，这里把清单收紧。

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# 只允许与 MIT OR Apache-2.0 兼容的许可。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
