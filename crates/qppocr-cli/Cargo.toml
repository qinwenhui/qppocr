[package]
name = "qppocr-cli"
description = "qppocr 的参考命令行入口"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false # 参考 CLI，不进 registry

[[bin]]
name = "qppocr"
path = "src/main.rs"

[dependencies]
qppocr = { path = "../qppocr", version = "0.2.0" }
# 参考 CLI 的全局分配器：CRT 堆在多线程分配下有锁竞争，mimalloc 消掉它
# （100 图 4 轮交错实测整体 0.983，收益集中在 det）。库本体不绑定分配器。
mimalloc = { version = "0.1", default-features = false }

[lints]
workspace = true
