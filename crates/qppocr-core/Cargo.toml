[package]
name = "qppocr-core"
description = "qppocr 引擎主体：ONNX 解析、图优化、执行器、det/cls/rec 流水线"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = ["parallel"]
# 关掉 = 单线程（透传给 kernels）
parallel = ["qppocr-kernels/parallel"]

[dependencies]
qppocr-kernels = { path = "../qppocr-kernels" }

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
