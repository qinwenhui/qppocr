[package]
name = "qppocr"
description = "纯 Rust、手写内核的 PP-OCRv6 推理引擎（面向上游官方 ONNX 原件）"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

keywords = ["ocr", "paddleocr", "onnx", "inference", "text-recognition"]
categories = ["computer-vision", "text-processing"]

[features]
default = ["std", "parallel", "image-decode"]
std = []
# 关掉 = 单线程（WASM/嵌入式用）
parallel = ["qppocr-core/parallel"]
# 图像解码（JPEG/PNG/BMP；BMP 无损、无 rayon 依赖）。关掉 = 只吃已解码像素
image-decode = ["dep:image"]
# GPU 设备后端（Vulkan 计算先行）。不进 default：默认构建保持零 GPU 依赖。
gpu = ["dep:qppocr-gpu"]
# GPU + CUDA 枚举（dlopen，无编译期 CUDA SDK 依赖）
gpu-cuda = ["gpu", "qppocr-gpu/cuda"]
# 结果/配置的 serde 序列化（结果类型在 core，feature 透传过去）
serde = ["dep:serde", "qppocr-core/serde"]

[dependencies]
qppocr-core = { path = "../qppocr-core", version = "0.3.1" }
qppocr-gpu = { path = "../qppocr-gpu", version = "0.3.1", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"], optional = true }
serde = { version = "1", default-features = false, optional = true, features = ["derive", "std"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

[[example]]
name = "api_verify"
required-features = ["serde"]
